name: chillandchat

services:
  server:
    container_name: chillandchat-backend-container
    build: ./server
    environment:
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - '${BACKEND_PORT}:3000'
    depends_on:
      database:
        condition: service_healthy
    restart: on-failure

  client:
    container_name: chillandchat-client-container
    build: ./client
    ports:
      - '${FRONTEND_PORT}:3000'
    # depends_on:
    #   database:
    #     condition: service_healthy
    # restart: on-failure

  database:
    image: postgres:latest
    container_name: chillandchat-database-container
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - '${DATABASE_PORT}:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure